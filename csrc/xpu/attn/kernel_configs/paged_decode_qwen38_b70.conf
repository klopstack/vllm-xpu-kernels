# Minimal paged-decode set for Qwen3.8-27B (head_dim=256, 24 q heads / 4 kv heads => ratio 6,
# so qgroup=8 at any TP). No sliding window, no attention sink.
# Format: qgroup,headsize,pagesize,causal,local,sink
# Both causal settings: the engine requested causal=false during warmup (MTP/decode path), so do
# not assume causal=true only. All four page sizes so a different --block-size still works;
# q16 for the ratio>8 bucket.
8,256,16,true,false,false
8,256,16,false,false,false
8,256,32,true,false,false
8,256,32,false,false,false
8,256,64,true,false,false
8,256,64,false,false,false
8,256,128,true,false,false
8,256,128,false,false,false
16,256,64,true,false,false
16,256,64,false,false,false
