# Minimal chunk-prefill set for Qwen3.8-27B.
# Format: headsize,paged,causal,local,sink,lse
# Text tower: head_dim=256. Both causal settings and every paged/lse combination — the decode
# path turned out to request causal=false, so be generous here rather than fail at runtime.
256,true,true,false,false,false
256,true,true,false,false,true
256,true,false,false,false,false
256,true,false,false,false,true
256,false,true,false,false,false
256,false,true,false,false,true
256,false,false,false,false,false
256,false,false,false,false,true
# Vision tower (Qwen3_5 ViT): head_dim 1152/16 = 72, non-paged, non-causal. 72 is not a
# supported size, so cover the sizes it can be padded to, both causal settings.
64,false,false,false,false,false
64,false,true,false,false,false
96,false,false,false,false,false
96,false,true,false,false,false
128,false,false,false,false,false
128,false,true,false,false,false
