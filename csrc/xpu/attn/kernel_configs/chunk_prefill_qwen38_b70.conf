# Minimal chunk-prefill set for Qwen3.8-27B.
# Format: headsize,paged,causal,local,sink,lse
# Text tower: head_dim=256, causal. paged=true is chunked prefill / MTP verification against the
# paged KV cache; paged=false is first-prompt processing; lse=true is chunked-prefill state merge.
256,true,true,false,false,false
256,true,true,false,false,true
256,false,true,false,false,false
256,false,true,false,false,true
# Vision tower (Qwen3_5 ViT): head_dim 1152/16 = 72, non-causal, non-paged. 72 is not a
# supported size, so cover the sizes it can be padded to.
64,false,false,false,false,false
96,false,false,false,false,false
128,false,false,false,false,false
